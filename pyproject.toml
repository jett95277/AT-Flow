[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "at-flow"
version = "0.1.0"
description = "CLI-first multi-agent orchestration platform"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
at = "at_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
