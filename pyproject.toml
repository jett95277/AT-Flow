[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "at-runtime"
version = "0.1.0"
description = "Context & Memory Control Plane for long-running and parallel coding agents"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
at = "at_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
