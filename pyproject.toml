[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "at-flow"
version = "0.1.0"
description = "CLI-first multi-agent orchestration platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "httpx>=0.28.1",
]

[project.scripts]
at = "at_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
